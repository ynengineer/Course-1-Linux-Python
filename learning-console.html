<div id="nae-console">
<label class="form-label">Lesson <select class="form-select" id="lesson"><option value="0">1 Linux Fundamentals</option><option value="1">2 Linux Administration</option><option value="2" selected>3 SSH Fundamentals</option></select></label>
<p id="save-status" role="status"></p>
<div id="summary" aria-live="polite"></div>
<h3>Lab terminal simulation</h3>
<p id="goal"></p>
<pre id="terminal" aria-live="polite" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre>
<form id="command-form"><label class="form-label" for="command">Command</label><input class="form-control" id="command" autocomplete="off" spellcheck="false"><div class="viz-row"><button class="btn btn-primary" type="submit">Run command</button><button class="btn" id="hint" type="button">Hint</button><button class="btn" id="solution" type="button">Solution</button><button class="btn" id="lab-check" type="button">Check lab</button></div></form>
<p id="lab-result" aria-live="polite"></p>
<h3>Configuration coding exercise</h3>
<label class="form-label" for="code">OpenSSH client configuration for lab-router</label>
<textarea class="form-control" id="code" rows="7" spellcheck="false" placeholder="Host lab-router&#10;    HostName ..."></textarea>
<button class="btn" type="button" id="code-check">Check configuration</button><p id="code-result" aria-live="polite"></p>
<h3>Knowledge test</h3><p>10 questions · pass at 8 correct · unlimited retries</p>
<form id="quiz"><div id="questions"></div><button class="btn btn-primary" type="submit">Grade quiz</button><button class="btn" type="button" id="retry">Clear answers for retry</button></form>
<p id="quiz-result" aria-live="polite"></p><div id="review"></div>
<h3>Saved attempts</h3><div id="attempts"></div>
<label class="form-label" for="notes">Resume notes and lab explanation</label><textarea id="notes" class="form-control" rows="3" maxlength="1200"></textarea><button class="btn" type="button" id="save-notes">Save notes</button>
<button class="btn" type="button" id="record">Show progress record</button><pre id="export" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre>
</div>
<script>
(() => {
const root=document.getElementById('nae-console'), el=id=>root.querySelector('#'+id);
const BANK=[[["Which command prints your current directory?",["pwd","ls","whoami"],0,"pwd prints the working directory."],["Which path is absolute?",["backups/r1.cfg","/home/student/automation","./devices.txt"],1,"A leading slash starts at filesystem root."],["What does a pipe do?",["Appends to a file","Changes permissions","Sends stdout to another command"],2,"The next command receives the previous output."],["What is the risk of > devices.txt?",["It overwrites existing content","It encrypts the file","It creates a directory"],0,"Use >> only when appending is intended."],["Which command includes hidden entries?",["ls","ls -la","pwd"],1,"The -a option includes dot entries."],["What does cd .. do?",["Deletes the directory","Returns to root","Moves to the parent directory"],2,"Two dots name the parent."],["Select lines containing store001.",["grep store001 devices.txt","cp store001 devices.txt","cd store001"],0,"grep filters matching text."],["Which command preserves an original by copying it?",["mv","cp","rm"],1,"cp leaves the source in place."],["Are Devices.txt and devices.txt generally the same Linux name?",["Always","Only with sudo","No"],2,"Linux filesystems commonly distinguish case."],["What does ~ mean for this shell user?",["The user's home directory","Always /root","Filesystem root"],0,"Home depends on the current user."]],[["What does sudo normally do?",["Enters Cisco enable mode","Runs an authorized command as another user","Encrypts the command"],1,"sudo commonly runs a command as root."],["What does chmod 600 give the owner?",["Execute only","Read only","Read and write"],2,"6 is 4 plus 2; group and others get zero."],["What does directory execute permission allow?",["Traversal","Encryption","Automatic backup"],0,"Directory execute is search/traversal permission."],["Inspect SSH service without changing it.",["systemctl restart ssh","systemctl status ssh","systemctl stop ssh"],1,"status observes; restart and stop change service state."],["Inspect recent logs for the SSH unit.",["ip route","chmod ssh","journalctl -u ssh -n 20"],2,"-u selects the unit and -n limits entries."],["What does apt update do?",["Refreshes package metadata","Upgrades every package","Reboots Linux"],0,"Installing updates is a separate operation."],["Which command shows routing state?",["whoami","ip route","df -h"],1,"ip route displays route information."],["Which command lists listening numeric TCP sockets?",["ss -lnt","ls -la","free -h"],0,"l=listening, n=numeric, t=TCP."],["A container lacks systemctl. What can you conclude?",["SSH must be down","The router is down","It may not run systemd"],2,"Service-manager absence is not a connectivity test."],["Best first action for a remote SSH problem?",["Restart everything","Collect path service and log evidence","Disable all permissions"],1,"Observe before disruptive changes."]],[["Which key identifies the server?",["User private key","Host key","User public key"],1,"Host identity and user authentication are separate."],["Where should your private user key remain?",["On every router","In chat","On the protected client"],2,"Provision the public key through an approved method."],["A host key unexpectedly changes. First action?",["Verify independently","Disable checking","Delete all known_hosts"],0,"Establish why identity changed before updating trust."],["Select a nondefault SSH port.",["ssh -i 2222 host","ssh -p 2222 host","ssh -J 2222 host"],1,"-p selects the remote port."],["Connection timeout most directly suggests investigating...",["Only the password","Python indentation","Network path ACL or server reachability"],2,"A timeout occurs before successful authentication."],["Permission denied most directly suggests...",["User authentication or policy","Successful login","A missing VLAN in every case"],0,"Review account key selection and AAA evidence."],["Why use a jump host for even one device?",["To remove encryption","To provide a controlled management path","To avoid authenticating"],1,"A controlled path can be useful independent of target count."],["Does ssh-keyscan alone verify a server identity?",["Yes always","Only for Cisco","No"],2,"Collected keys need independent trust verification."],["Preferred course SSH backend for Ansible network_cli?",["libssh via ansible-pylibssh","Deprecated Paramiko preference","Telnet"],0,"Use the supported libssh backend and inspect installed versions."],["Preferred libssh variable for a jump proxy?",["ansible_paramiko_proxy_command","ansible_libssh_proxy_command","ansible_python_interpreter"],1,"Choose the variable for the active connection library."]]];
const blank=()=>({cwd:'/home/student',dirs:['/home/student'],files:{},perms:{},seen:[],verified:false,connected:false});
const initial=()=>({version:1,lessons:[0,1,2].map(()=>({lab:false,attempts:[],notes:'',code:'',answers:[],sim:blank()}))});
let state=initial(),current=2,dirty=false;
const normalize=x=>{const d=initial();if(x&&x.version===1&&Array.isArray(x.lessons)){for(let i=0;i<3;i++){const v=x.lessons[i];if(v&&typeof v==='object')d.lessons[i]={...d.lessons[i],...v,attempts:Array.isArray(v.attempts)?v.attempts:[],sim:{...blank(),...(v.sim||{})}}}}return d};
const saved=()=>window.openai?.widgetState?.modelContent?.course;
if(saved())state=normalize(saved());
const active=()=>state.lessons[current];
const status=()=>el('save-status').textContent=window.openai?.setWidgetState?'Pages state available. Changes are sent to saved course state.':'Session only: saved state unavailable. Copy Show progress record into the editable record below.';
const persist=()=>{dirty=true;status();if(window.openai?.setWidgetState){if(new TextEncoder().encode(JSON.stringify(state)).length>14000){el('save-status').textContent='Saved state is full. Copy the complete progress record into the editable Page to preserve this session; no attempt history was deleted.';return}const old=window.openai.widgetState||{};try{const result=window.openai.setWidgetState({...old,modelContent:{...(old.modelContent||{}),course:state}});if(result?.catch)result.catch(()=>el('save-status').textContent='Save failed. Copy the progress record into the editable Page record.')}catch(e){el('save-status').textContent='Save failed. Copy the progress record into the editable Page record.'}}};
const goals=[
'Create ~/automation/backups, create the two-line devices.txt inventory, filter store001, copy to devices.bak and count lines. Type help for supported commands.',
'Create ~/automation/lab-inventory.txt, set mode 600, inspect it and collect identity, SSH status, logs, routes and listening sockets. Type help.',
'Attempt SSH, verify the fictional console fingerprint, reconnect, run show version and exit. Type help. Then explain host identity versus user authentication in your notes.'
];
const solutions=[
"mkdir -p ~/automation/backups\ncd ~/automation\nprintf 'store001-rtr 192.0.2.11\\nstore002-rtr 192.0.2.12\\n' > devices.txt\ngrep store001 devices.txt\ncp devices.txt devices.bak\nwc -l devices.txt",
'mkdir -p ~/automation\ncd ~/automation\ntouch lab-inventory.txt\nchmod 600 lab-inventory.txt\nls -l lab-inventory.txt\nwhoami\nid\nsystemctl status ssh\njournalctl -u ssh -n 20\nip route\nss -lnt',
'ssh netauto@192.0.2.11\nverify-host\nssh netauto@192.0.2.11\nshow version\nexit'];
const hints=['mkdir -p creates parent directories. The inventory needs two newline-terminated records.','6 = read plus write. Start with status and logs, not restart.','The simulated trusted console fingerprint must match before connecting.'];
let transcript=[];
function path(s){if(s==='~')s='/home/student';else if(s.startsWith('~/'))s='/home/student/'+s.slice(2);else if(!s.startsWith('/'))s=active().sim.cwd+'/'+s;const parts=[];s.split('/').forEach(p=>{if(p==='..')parts.pop();else if(p&&p!=='.')parts.push(p)});return '/'+parts.join('/')}
function write(s){transcript.push(s);transcript=transcript.slice(-36);el('terminal').textContent=transcript.join('\n')}
function run(cmd){const s=active().sim,parts=cmd.trim().split(/\s+/),op=parts[0],p=path(parts.at(-1)||'.');if(!cmd.trim())return '';const seen=tag=>{if(!s.seen.includes(tag))s.seen.push(tag)};
if(cmd==='help')return 'Restricted simulator; no actual shell or network. Supported: pwd, ls [-la|-l] [path], cd path, mkdir -p path, printf \'text\\n\' > file, cat file, grep pattern file, cp source destination, wc -l file, touch file, chmod 600 file, whoami, id, systemctl status ssh, journalctl -u ssh -n 20, ip address, ip route, ss -lnt, df -h, free -h, ssh netauto@192.0.2.11, verify-host, show version, exit, auth-error. Pipes and arbitrary programs are not implemented.';
if(op==='pwd')return s.cwd;
if(op==='mkdir'){let x='';p.split('/').filter(Boolean).forEach(t=>{x+='/'+t;if(!s.dirs.includes(x))s.dirs.push(x)});return 'Directory ready: '+p}
if(op==='cd'){if(!s.dirs.includes(p))return 'No such directory';s.cwd=p;return s.cwd}
if(op==='printf'){const m=cmd.match(/^printf\s+'([^']*)'\s*>\s*(\S+)$/);if(!m)return 'Supported format: printf \'text\\n\' > file';const target=path(m[2]);if(!s.dirs.includes(target.slice(0,target.lastIndexOf('/'))))return 'Parent directory missing';s.files[target]=m[1].replace(/\\n/g,'\n');return 'Wrote '+target}
if(op==='touch'){s.files[p]??='';return 'File ready: '+p}
if(op==='cat')return s.files[p]??'No such file';
if(op==='cp'){const source=path(parts[1]||'');if(!(source in s.files))return 'Source missing';s.files[p]=s.files[source];return 'Copied'}
if(op==='grep'){if(!(p in s.files))return 'File missing';seen('grep');return s.files[p].split('\n').filter(x=>x.includes(parts[1])).join('\n')||'(no matches)'}
if(op==='wc'){if(!(p in s.files))return 'File missing';seen('wc');return (s.files[p].match(/\n/g)||[]).length+' '+parts.at(-1)}
if(op==='chmod'){if(!(p in s.files))return 'File missing';if(parts[1]!=='600')return 'This lab accepts mode 600';s.perms[p]='600';return 'Mode set: 600'}
if(op==='ls'){seen('ls');return Object.keys(s.files).filter(f=>f.startsWith(s.cwd+'/')).map(f=>(s.perms[f]==='600'?'-rw-------':'-rw-r--r--')+' student student '+f).concat(s.dirs.filter(d=>d.startsWith(s.cwd+'/')).map(d=>'drwxr-xr-x '+d)).join('\n')||'(empty)'}
const reports={'whoami':'student','id':'uid=1000(student) gid=1000(student)','systemctl status ssh':'ssh.service: active (running)','systemctl status ssh --no-pager':'ssh.service: active (running)','journalctl -u ssh -n 20':'sshd: Failed publickey for netauto from 192.0.2.50','journalctl -u ssh -n 20 --no-pager':'sshd: Failed publickey for netauto from 192.0.2.50','ip route':'default via 192.0.2.1 dev eth0','ip address':'eth0: 192.0.2.50/24','ss -lnt':'LISTEN 0 128 0.0.0.0:22','df -h':'/dev/lab 20G 5G 15G 25% /','free -h':'Mem: 4Gi total, 2Gi available'};
if(reports[cmd]){seen(cmd.replace(' --no-pager',''));return reports[cmd]}
if(cmd==='verify-host'){s.verified=true;seen('verified');return 'Fictional trusted console fingerprint SHA256:SIMULATED-LAB-ONLY matches the presented host key. Trust recorded in this simulation.'}
if(cmd==='ssh netauto@192.0.2.11'){seen('ssh-attempt');if(!s.verified)return 'Host identity unverified: SHA256:SIMULATED-LAB-ONLY. Stop and verify via trusted console (verify-host).';s.connected=true;seen('connected');return 'Authenticated as fictional netauto. store001-rtr#'}
if(cmd==='show version'){if(!s.connected)return 'Connect to simulated router first';seen('show');return 'Cisco IOS XE Software — simulated C1111 lab output'}
if(cmd==='exit'){s.connected=false;seen('exit');return 'Connection closed'}
if(cmd==='auth-error')return 'Permission denied (publickey). Inspect the selected identity, user and AAA logs. Host-key checks remain enabled.';
return 'Unsupported simulator command. Type help. No operation executed.';
}
function summary(){const rows=state.lessons.map((l,i)=>{const best=Math.max(0,...l.attempts.map(a=>a.score));return 'Lesson '+(i+1)+': '+(l.lab&&best>=80?'Complete':l.lab?'Lab done; quiz pending':best>=80?'Quiz passed; lab pending':'Unverified')+' · best '+(l.attempts.length?best+'%':'not attempted')});el('summary').textContent=rows.join(' | ')+' | Lessons 4–14: outlines, unattempted.'}
function render(){el('lesson').value=current;el('goal').textContent=goals[current];el('code').value=active().code;el('notes').value=active().notes;el('lab-result').textContent=active().lab?'Lab passed in simulation.':'';el('code-result').textContent='';el('quiz-result').textContent='';el('review').replaceChildren();el('questions').replaceChildren();transcript=[];write('Simulation ready. Saved virtual filesystem retained; type help.');BANK[current].forEach((q,i)=>{const f=document.createElement('fieldset'),legend=document.createElement('legend');legend.textContent=(i+1)+'. '+q[0];f.append(legend);q[1].forEach((text,j)=>{const label=document.createElement('label');label.className='form-check';const input=document.createElement('input');input.className='form-check-input';input.type='radio';input.name='q'+i;input.value=j;input.checked=active().answers[i]===j;input.onchange=()=>{active().answers[i]=j;persist()};label.append(input,document.createTextNode(' '+text));f.append(label)});el('questions').append(f)});attempts();summary();status()}
function attempts(){el('attempts').textContent=active().attempts.map((a,i)=>'#'+(i+1)+' '+a.at+' '+a.score+'% '+(a.score>=80?'PASS':'RETRY')).join(' | ')||'No attempts recorded.'}
el('lesson').onchange=e=>{current=Number(e.target.value);render()};
el('command-form').onsubmit=e=>{e.preventDefault();const c=el('command').value.trim();write('$ '+c);write(run(c));el('command').value='';persist()};
el('hint').onclick=()=>el('lab-result').textContent=hints[current];
el('solution').onclick=()=>el('lab-result').textContent=solutions[current];
el('lab-check').onclick=()=>{const s=active().sim,seen=x=>s.seen.includes(x);let pass=false;if(current===0){const f=s.files['/home/student/automation/devices.txt'];pass=s.dirs.includes('/home/student/automation/backups')&&f==='store001-rtr 192.0.2.11\nstore002-rtr 192.0.2.12\n'&&s.files['/home/student/automation/devices.bak']===f&&seen('grep')&&seen('wc')}if(current===1)pass=s.perms['/home/student/automation/lab-inventory.txt']==='600'&&['whoami','id','ls','systemctl status ssh','journalctl -u ssh -n 20','ip route','ss -lnt'].every(seen);if(current===2)pass=['ssh-attempt','verified','connected','show','exit'].every(seen);if(pass){active().lab=true;persist();summary()}el('lab-result').textContent=pass?'Lab passed in simulation. Add your explanation in resume notes.':'Not yet complete. Compare your work with the goal; use a hint if needed.'};
el('code-check').onclick=()=>{active().code=el('code').value.slice(0,1600);const c=active().code;const required=[/^Host lab-router\s*$/m,/^\s+HostName 192\.0\.2\.11\s*$/m,/^\s+User netauto\s*$/m,/^\s+IdentityFile ~\/\.ssh\/netauto_lab\s*$/m,/^\s+StrictHostKeyChecking yes\s*$/m];el('code-result').textContent=required.every(re=>re.test(c))&&!/StrictHostKeyChecking\s+(no|off)/i.test(c)?'Required directives found. Static exercise only; real SSH configuration is not executed.':'Include Host lab-router, HostName 192.0.2.11, User netauto, IdentityFile ~/.ssh/netauto_lab and StrictHostKeyChecking yes with indented directives.';persist()};
el('quiz').onsubmit=e=>{e.preventDefault();if(BANK[current].some((_,i)=>!Number.isInteger(active().answers[i]))){el('quiz-result').textContent='Answer all 10 questions before grading.';return}let correct=0;const review=[];BANK[current].forEach((q,i)=>{if(active().answers[i]===q[2])correct++;else review.push((i+1)+': '+q[3])});const score=correct*10;active().attempts.push({at:new Date().toISOString(),score,answers:active().answers.slice()});el('quiz-result').textContent=correct+'/10 · '+score+'% · '+(score>=80?'PASS':'RETRY — review missed concepts');el('review').textContent=review.join(' | ');persist();attempts();summary()};
el('retry').onclick=()=>{active().answers=[];persist();render()};
el('save-notes').onclick=()=>{active().notes=el('notes').value.slice(0,1200);persist()};
el('record').onclick=()=>el('export').textContent=JSON.stringify(state,null,2);
window.addEventListener('openai:set_globals',event=>{const incoming=event.detail?.globals?.widgetState?.modelContent?.course||saved();if(incoming){state=normalize(incoming);dirty=false;render()}});
render();
})();
</script>
